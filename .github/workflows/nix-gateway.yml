name: Nix gateway

on:
  push:
    branches: [agent/nemotron-aic-gateway]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - voice_agent/**
      - .github/workflows/nix-gateway.yml
  workflow_dispatch:

jobs:
  linux-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31.10.6
      - name: Check flake outputs
        run: nix flake check --all-systems
      - name: Build x86-64 Linux package
        run: nix build .#gateway-stack --print-build-logs
      - name: Smoke Linux gateway and Riva
        run: |
          ./result/bin/callevate-stack > "$RUNNER_TEMP/gateway.log" 2>&1 &
          stack_pid=$!
          trap 'kill "$stack_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if ./result/bin/callevate-smoke > "$RUNNER_TEMP/smoke.log" 2>&1; then
              cat "$RUNNER_TEMP/smoke.log"
              exit 0
            fi
            if ! kill -0 "$stack_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/gateway.log"
              cat "$RUNNER_TEMP/smoke.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/gateway.log"
          cat "$RUNNER_TEMP/smoke.log"
          exit 1
      - name: Smoke in Red Hat UBI 9.2
        run: |
          bundle_path=$(readlink -f result)
          docker run --rm --network none \
            --mount type=bind,source=/nix/store,target=/nix/store,readonly \
            --env BUNDLE_PATH="$bundle_path" \
            registry.access.redhat.com/ubi9/ubi:9.2 \
            /bin/bash -euo pipefail -c '
              "$BUNDLE_PATH/bin/callevate-stack" > /tmp/gateway.log 2>&1 &
              stack_pid=$!
              trap "kill $stack_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 90); do
                if "$BUNDLE_PATH/bin/callevate-smoke" > /tmp/smoke.log 2>&1; then
                  cat /tmp/smoke.log
                  exit 0
                fi
                if ! kill -0 "$stack_pid" 2>/dev/null; then
                  cat /tmp/gateway.log
                  cat /tmp/smoke.log
                  exit 1
                fi
                sleep 2
              done
              cat /tmp/gateway.log
              cat /tmp/smoke.log
              exit 1
            '
